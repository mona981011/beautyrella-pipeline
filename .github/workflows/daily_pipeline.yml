name: Daily Meta Ads Pipeline
on:
  schedule:
    # 하루 두 번 돈다. GitHub의 schedule 트리거는 베스트에포트라 수 시간 밀리거나
    # 아예 건너뛰는 날이 있어(2026-11-23분 누락), 1차가 안 돌면 2차가 메우게 한다.
    # 스크립트가 datetime.now(KST) 기준 "어제"를 잡으므로 두 번 다 같은 날짜를 적재하고,
    # 적재 전에 해당 날짜를 DELETE 후 INSERT 하므로 중복이 생기지 않는다.
    #
    # 1차 03:07 KST — 09:15 KST 알림 전에 여유 있게 끝나도록 앞당겨 잡는다.
    # 정각은 전 세계 워크플로가 몰려 큐가 가장 밀리므로 분 단위를 비켜 둔다.
    - cron: "7 18 * * *"
    # 2차 09:07 KST — 1차가 누락됐을 때의 보정분.
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      backfill_mode:
        description: "백필 모드 (true/false)"
        required: false
        default: "false"
      backfill_start:
        description: "백필 시작일 (YYYY-MM-DD)"
        required: false
        default: "2026-02-23"
      backfill_end:
        description: "백필 종료일 (YYYY-MM-DD)"
        required: false
        default: "2026-05-31"
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install requests google-cloud-bigquery
      - name: GCP 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"
      - name: 파이프라인 실행
        env:
          META_ACCESS_TOKEN: "${{ secrets.META_ACCESS_TOKEN }}"
          META_AD_ACCOUNT_ID: "${{ secrets.META_AD_ACCOUNT_ID }}"
          BACKFILL_MODE: "${{ github.event.inputs.backfill_mode || 'false' }}"
          BACKFILL_START: "${{ github.event.inputs.backfill_start }}"
          BACKFILL_END: "${{ github.event.inputs.backfill_end }}"
        run: python fetch_meta_ads.py
      - name: 연령별 데이터 파이프라인 실행
        env:
          META_ACCESS_TOKEN: "${{ secrets.META_ACCESS_TOKEN }}"
          META_AD_ACCOUNT_ID: "${{ secrets.META_AD_ACCOUNT_ID }}"
          BACKFILL_MODE: "${{ github.event.inputs.backfill_mode || 'false' }}"
          BACKFILL_START: "${{ github.event.inputs.backfill_start }}"
          BACKFILL_END: "${{ github.event.inputs.backfill_end }}"
        run: python fetch_meta_ads_age.py
      - name: 지역별 데이터 파이프라인 실행
        env:
          META_ACCESS_TOKEN: "${{ secrets.META_ACCESS_TOKEN }}"
          META_AD_ACCOUNT_ID: "${{ secrets.META_AD_ACCOUNT_ID }}"
          BACKFILL_MODE: "${{ github.event.inputs.backfill_mode || 'false' }}"
          BACKFILL_START: "${{ github.event.inputs.backfill_start }}"
          BACKFILL_END: "${{ github.event.inputs.backfill_end }}"
        run: python fetch_meta_ads_region.py
      # 적재가 끝났으니 리포트를 깨운다. 리포트를 시각이 아니라 적재 완료에 묶는다.
      #
      # GitHub 의 schedule 이 하루 1~2시간씩 밀려(11/25 11:19, 11/26 10:44, 11/27 10:40)
      # 10:00 에 고정돼 있던 리포트를 매일 추월했다. 적재가 끝난 자리에서 부르면
      # 언제 돌든 순서가 뒤집히지 않는다.
      #
      # requireData=1 이라 어제 데이터가 없으면 대시보드가 보내지 않고 물러난다.
      # 하루 한 번만 나가므로, 이미 나갔으면 여기서는 아무 일도 일어나지 않는다.
      # 백필로 수동 실행했을 때는 어제 데이터와 무관하므로 건너뛴다.
      - name: 대시보드 리포트 발송
        if: ${{ github.event.inputs.backfill_mode != 'true' }}
        env:
          CRON_SECRET: "${{ secrets.CRON_SECRET }}"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET 미설정 — 리포트 발송을 건너뜁니다(적재는 정상)."
            exit 0
          fi
          code=$(curl -sS -o /tmp/report.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            'https://beautyrella-dashboard.vercel.app/api/alerts/daily?requireData=1')
          echo "HTTP $code"
          cat /tmp/report.json
          echo
          # 리포트 발송 실패가 적재 성공을 뒤집지는 않게 한다. 데이터는 이미 들어가 있다.
          [ "$code" = "200" ] || echo "::warning::리포트 발송에 실패했습니다. 정오 폴백이 다시 시도합니다."
