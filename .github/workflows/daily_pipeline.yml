name: Daily Meta Ads Pipeline
on:
  schedule:
    # 05:43 KST. 정각은 전 세계 워크플로가 몰려 큐가 가장 밀리므로 분 단위를 비켜 둔다.
    # 스크립트가 datetime.now(KST) 기준으로 "어제"를 잡으므로 KST 자정(15:00 UTC) 이후이기만 하면 된다.
    # 03:00 KST. GitHub의 schedule 트리거는 베스트에포트라 매일 2~5시간 밀리므로,
    # 09:15 KST 알림 전에 끝나도록 충분한 여유를 두고 앞당겨 잡는다.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      backfill_mode:
        description: "백필 모드 (true/false)"
        required: false
        default: "false"
      backfill_start:
        description: "백필 시작일 (YYYY-MM-DD)"
        required: false
        default: "2026-02-23"
      backfill_end:
        description: "백필 종료일 (YYYY-MM-DD)"
        required: false
        default: "2026-05-31"
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install requests google-cloud-bigquery
      - name: GCP 인증
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}"
      - name: 파이프라인 실행
        env:
          META_ACCESS_TOKEN: "${{ secrets.META_ACCESS_TOKEN }}"
          META_AD_ACCOUNT_ID: "${{ secrets.META_AD_ACCOUNT_ID }}"
          BACKFILL_MODE: "${{ github.event.inputs.backfill_mode || 'false' }}"
          BACKFILL_START: "${{ github.event.inputs.backfill_start }}"
          BACKFILL_END: "${{ github.event.inputs.backfill_end }}"
        run: python fetch_meta_ads.py
      - name: 연령별 데이터 파이프라인 실행
        env:
          META_ACCESS_TOKEN: "${{ secrets.META_ACCESS_TOKEN }}"
          META_AD_ACCOUNT_ID: "${{ secrets.META_AD_ACCOUNT_ID }}"
          BACKFILL_MODE: "${{ github.event.inputs.backfill_mode || 'false' }}"
          BACKFILL_START: "${{ github.event.inputs.backfill_start }}"
          BACKFILL_END: "${{ github.event.inputs.backfill_end }}"
        run: python fetch_meta_ads_age.py
